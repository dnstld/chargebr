schema: spec-driven

context: |
  Language: pt-BR
  All artifacts must be written in pt-BR.
  Keep OpenSpec structural headings and SHALL/MUST keywords in English.

  ## Projeto

  ChargeBR — plataforma de inteligência sobre mobilidade elétrica no Brasil.
  Fase atual: criação da biblioteca de interface e do shell do back office.
  Decisões estruturais em docs/decisao-configuracao-inicial-do-workspace.md.

  Leia antes de refinar ou propor qualquer coisa:
  - docs/pontos-abertos.md — o que está aberto de propósito, com o gatilho de
    cada ponto. Se o trabalho toca um ponto, cite o número.
  - docs/forma-do-produto.md — o que do produto está resolvido e o que não está.
    Muita pergunta de arquitetura é derivada de uma que está em aberto ali;
    responder a de cima sem ver a de baixo decide a maior por acidente.
  - docs/README.md — o índice das decisões anteriores.

  ## Stack fixada

  - Monorepo pnpm workspaces, apenas apps/* e packages/*
  - Node 24.21.0, pnpm 10.34.5, ESM, TypeScript 5.9 estrito
  - Aplicação: Next.js 16 App Router, React 19
  - Pacotes: @chargebr/tokens (Style Dictionary, DTCG) e @chargebr/ui
    (átomos, moléculas, organismos e gráficos por subpath)
  - Primitivas de comportamento: React Aria Components
  - Estilo: CSS Modules consumindo custom properties de @chargebr/tokens
  - Gráficos: visx
  - Verificação: Biome 2 e Vitest 5 sob `pnpm verify` na raiz
  - Documentação viva: Storybook 10 com addon-vitest e addon-a11y

  ## Fora de escopo, sem exceção

  Nenhuma mudança fora de apps/, packages/, openspec/, tools/ e da seção
  Interface de docs/. Na raiz, os scripts `collect`, `extract` e `test` do
  package.json não são nossos: `verify` os consome e não os altera. Nenhuma
  rota de negócio, nenhuma chamada a banco e nenhum dado real nesta fase.

  ## Convenções do repositório

  - Documentação, comentário e rótulo de interface em PT-BR.
  - Commit e título de PR em PT-BR, uma linha, sem corpo e sem assinatura:
    `<tipo>: <ação em imperativo>`, tipos feat, fix, docs, db, data, chore.
    Branch continua em `<tipo>/<nome-em-ingles-kebab>`, em inglês.
  - Nome de componente, prop e token em inglês.
  - Corpo de PR em PT-BR, nesta ordem: Resumo, Estado atual confirmado, Decisão
    operacional, Escopo, Verificação.

rules:
  proposal:
    - Diga explicitamente o que a mudança não faz
    - Nenhuma decisão em aberto pode ser preenchida por suposição; registre a lacuna e pare
  specs:
    - Requisito só existe se nomear o que quebra sem ele, hoje, no que está construído. Regra sobre dado que nenhuma tela exibe é anotação, não requisito
    - Todo critério de aceite nomeia o teste que o prova
    - Critério de aceite descreve comportamento observável, nunca implementação ou biblioteca
    - Declare os estados obrigatórios, inclusive os não aplicáveis, com a razão
    - "O corpo de um requisito contém só o que obriga; a razão vai em bloco próprio, aberto por **Por quê:**"
    - "Frase que não obriga, mas sem a qual muda o que é exigido, não é razão: reescreva-a como obrigação"
  design:
    - Nenhum valor literal de cor, espaçamento, raio, sombra ou tipografia em código de componente; só token
    - Componente que usa React Aria ou estado do cliente declara "use client" no próprio arquivo
    - Componente recebe dados por propriedade; nenhum componente busca dados
    - "A sonda que sustenta uma decisão reproduz a forma do uso real de que a decisão depende. Onde simplificar, o design diz o que simplificou e por que a simplificação não altera o que está sendo decidido"
  tasks:
    - Tarefa sem teste correspondente não é considerada pronta
    - Toda tarefa tem critério de pronto verificável por execução

operations:
  apply:
    guidance:
      - Código, história no Storybook e teste entram juntos
      - "`pnpm verify` precisa passar antes de a mudança ser dada como aplicada"
  archive:
    guidance:
      - Afirmação de acessibilidade só vale com execução do axe registrada
